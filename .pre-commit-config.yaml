# Pre-commit hooks for openCenter AirGap
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Remove trailing whitespace from all files
      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensure files end with a newline
      - id: check-yaml
        name: Check YAML syntax
        description: Validate YAML files
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-json
        name: Check JSON syntax
        description: Validate JSON files
      - id: check-added-large-files
        name: Check for large files
        description: Prevent committing files larger than 500KB
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Detect merge conflict markers
      - id: check-case-conflict
        name: Check for case conflicts
        description: Detect case-insensitive filename conflicts
      - id: mixed-line-ending
        name: Check line endings
        description: Ensure consistent line endings
        args: ['--fix=lf']

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Format Python code with Black
        description: Auto-format Python code
        language_version: python3
        args: ['--line-length=100']

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Type check with mypy
        description: Static type checking for Python
        additional_dependencies:
          - types-PyYAML
          - types-jsonschema
        args:
          - --strict
          - --ignore-missing-imports
        files: ^src/

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        name: Lint shell scripts
        description: Static analysis for shell scripts
        args: ['-x', '-e', 'SC1091']  # -x: follow sources, -e: exclude SC1091 (source not found)

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        description: Prevent committing secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            \.secrets/.*|
            tests/.*|
            \.hypothesis/.*
          )$

  # Custom hooks
  - repo: local
    hooks:
      - id: check-generated-files
        name: Check generated files
        description: Verify generated files are up-to-date
        entry: scripts/hooks/check-generated-files.sh
        language: script
        files: ^(config/.*\.(txt|env|json)|zarf\.yaml\.template)$
        pass_filenames: false

      - id: check-python-imports
        name: Check Python imports
        description: Verify all imports are from opencenter_build package
        entry: python -c "import sys; sys.exit(0)"
        language: system
        files: ^src/opencenter_build/.*\.py$
        pass_filenames: false

# Configuration
default_language_version:
  python: python3

# Exclude patterns
exclude: |
  (?x)^(
    \.git/.*|
    \.mypy_cache/.*|
    \.pytest_cache/.*|
    \.hypothesis/.*|
    build/.*|
    dist/.*|
    .*\.egg-info/.*|
    __pycache__/.*
  )$
