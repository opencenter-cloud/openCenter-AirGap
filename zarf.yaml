kind: ZarfPackageConfig
metadata:
  name: opencenter-airgap
  description: Air-gapped Kubernetes cluster deployment with Kubespray
  version: 1.0.0-rc1
  architecture: amd64
  authors: openCenter Team
  url: https://github.com/opencenter/opencenter-airgap
  vendor: openCenter
  # Note: This file is generated from zarf.yaml.template
  # Do not edit directly - run scripts/build/generate_zarf_yaml.py
variables:
- name: DEPLOYMENT_MODE
  description: 'Deployment mode: baremetal or openstack'
  default: baremetal
  prompt: false
- name: BASTION_IP
  description: IP address of bastion host
  default: ""
  prompt: true
- name: SSH_USER
  description: SSH user for node access
  default: deployer
  prompt: false
- name: INSTALL_PATH
  description: Installation directory on bastion
  default: /opt/opencenter
  prompt: false
- name: REGISTRY_PORT
  description: Local registry port
  default: '35000'
  prompt: false
- name: NGINX_PORT
  description: Nginx file server port
  default: '80'
  prompt: false
components:
# Component 1: bootstrap-tools
# Dependencies: None
# Independence: Fully independent, can deploy alone
# Provides: Python venv, deployment scripts
- name: bootstrap-tools
  description: Python environment and deployment scripts
  required: true
  files:
  - source: assets/python-wheels/
    target: '###ZARF_VAR_INSTALL_PATH###/python-wheels/'
    executable: false
  - source: assets/target-scripts/
    target: '###ZARF_VAR_INSTALL_PATH###/target-scripts/'
    executable: true
  actions:
    onDeploy:
      after:
      - cmd: 'python3 -m venv ###ZARF_VAR_INSTALL_PATH###/venv'
        description: Create Python virtual environment
      - cmd: '###ZARF_VAR_INSTALL_PATH###/venv/bin/pip install --no-index --find-links=###ZARF_VAR_INSTALL_PATH###/python-wheels/
          ansible jinja2 netaddr'
        description: Install Python dependencies
# Component 2: terraform-providers
# Dependencies: None
# Independence: Fully independent, can deploy alone or skip for bare-metal
# Provides: Terraform provider mirror, .terraformrc config
- name: terraform-providers
  description: Terraform provider filesystem mirror for OpenStack
  required: false
  files:
  - source: assets/terraform-mirror/
    target: '###ZARF_VAR_INSTALL_PATH###/terraform-mirror/'
    executable: false
  - source: assets/terraform/.terraformrc
    target: /root/.terraformrc
    executable: false
  - source: assets/terraform/.terraform.lock.hcl
    target: '###ZARF_VAR_INSTALL_PATH###/terraform/.terraform.lock.hcl'
    executable: false
  actions:
    onDeploy:
      after:
      - cmd: 'mkdir -p ###ZARF_VAR_INSTALL_PATH###/terraform-cache'
        description: Create Terraform cache directory
      - cmd: 'echo "Terraform providers mirrored:" && ls -lh ###ZARF_VAR_INSTALL_PATH###/terraform-mirror/registry.terraform.io/ 2>/dev/null | head -10 || echo "No providers found"'
        description: Verify Terraform provider mirror
# Component 3: kubespray-offline
# Dependencies: None
# Independence: Fully independent
# Provides: K8s binaries, OS packages (debs), PyPI wheels, container images
- name: kubespray-offline
  description: Kubespray offline assets (binaries, packages, images)
  required: true
  files:
  - source: build/kubespray-offline/outputs/
    target: '###ZARF_VAR_INSTALL_PATH###/kubespray-offline/'
    executable: false
  actions:
    onDeploy:
      after:
      - cmd: |
          echo "Kubespray offline assets deployed:"
          find ###ZARF_VAR_INSTALL_PATH###/kubespray-offline -type f | wc -l | xargs echo "Files:"
          du -sh ###ZARF_VAR_INSTALL_PATH###/kubespray-offline | awk '{print "Size: " $1}'
        description: Verify kubespray-offline assets
# Component 4: kubespray-core
# Dependencies: bootstrap-tools (logical, for Python venv used later by Kubespray)
# Independence: Can deploy independently (only copies files, no runtime dependency)
# Provides: Kubespray playbooks, K8s binaries, package repos
- name: kubespray-core
  description: Kubespray playbooks, K8s binaries, and package repositories
  required: true
  files:
  - source: assets/kubespray/
    target: '###ZARF_VAR_INSTALL_PATH###/kubespray/'
    executable: false
  - source: assets/k8s-binaries/
    target: '###ZARF_VAR_INSTALL_PATH###/k8s-binaries/'
    executable: false
  - source: assets/repos/
    target: '###ZARF_VAR_INSTALL_PATH###/repos/'
    executable: false
  - source: assets/playbook/
    target: '###ZARF_VAR_INSTALL_PATH###/playbook/'
    executable: false
# Component 5: k8s-images
# Dependencies: None
# Independence: Fully independent, can deploy alone
# Provides: Container images via Zarf's native image handling
- name: k8s-images
  description: Container images for Kubernetes and core services
  required: true
###IMAGES_BLOCK###
# Component 6: operator-tools
# Dependencies: None
# Independence: Fully independent, optional component
# Provides: CLI tools for cluster operators (k9s, helm, stern, kubectx)
- name: operator-tools
  description: Optional CLI tools for cluster operators
  required: false
  files:
  - source: assets/operator-tools/k9s
    target: /usr/local/bin/k9s
    executable: true
  - source: assets/operator-tools/helm
    target: /usr/local/bin/helm
    executable: true
  - source: assets/operator-tools/stern
    target: /usr/local/bin/stern
    executable: true
  - source: assets/operator-tools/kubectx
    target: /usr/local/bin/kubectx
    executable: true
  - source: assets/operator-tools/kubens
    target: /usr/local/bin/kubens
    executable: true
  actions:
    onDeploy:
      after:
      - cmd: |
          echo "Operator tools installed:"
          k9s version || echo "k9s: $(k9s version 2>&1 | head -1)"
          helm version --short || echo "helm: $(helm version --short 2>&1)"
          stern --version || echo "stern: $(stern --version 2>&1)"
          echo "kubectx/kubens: installed"
        description: Verify operator tools installation
# Component 7: deploy-cluster
# Dependencies: bootstrap-tools (needs target-scripts), kubespray-core (needs playbooks)
# Independence: Cannot deploy independently, requires prerequisites
# Provides: Bastion setup orchestration (nginx, registry, Python venv)
- name: deploy-cluster
  description: Cluster deployment orchestration
  required: true
  actions:
    onDeploy:
      after:
      - cmd: '###ZARF_VAR_INSTALL_PATH###/target-scripts/setup-all.sh'
        description: Setup bastion services (nginx, registry, Python)
        dir: '###ZARF_VAR_INSTALL_PATH###'
