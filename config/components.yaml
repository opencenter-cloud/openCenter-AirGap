# Component Manifest
# This file is GENERATED from config/versions.env
# To regenerate: python3 -m opencenter_build.cli init --create-manifest
#
# You can customize this file by:
# - Adding/removing components with 'opencenter-airgap add' command
# - Manually editing this file
#
# Note: Regenerating will overwrite manual changes

kubernetes:
  version: 1.34.3
  binaries:
  - name: kubectl
    url: https://dl.k8s.io/v{{version}}/bin/linux/amd64/kubectl
    checksum_url: https://dl.k8s.io/v{{version}}/bin/linux/amd64/kubectl.sha256
  - name: kubelet
    url: https://dl.k8s.io/v{{version}}/bin/linux/amd64/kubelet
    checksum_url: https://dl.k8s.io/v{{version}}/bin/linux/amd64/kubelet.sha256
  - name: kubeadm
    url: https://dl.k8s.io/v{{version}}/bin/linux/amd64/kubeadm
    checksum_url: https://dl.k8s.io/v{{version}}/bin/linux/amd64/kubeadm.sha256

tools:
- name: helm
  version: 4.0.5
  url: https://get.helm.sh/helm-v{{version}}-linux-amd64.tar.gz
  checksum_url: null
  extract: true
  binary: linux-amd64/helm
- name: k9s
  version: 0.50.9
  url: https://github.com/derailed/k9s/releases/download/v{{version}}/k9s_Linux_amd64.tar.gz
  checksum_url: null
  extract: true
  binary: k9s
- name: stern
  version: 1.33.1
  url: https://github.com/stern/stern/releases/download/v{{version}}/stern_{{version}}_linux_amd64.tar.gz
  checksum_url: null
  extract: true
  binary: stern
- name: yq
  version: 4.47.2
  url: https://github.com/mikefarah/yq/releases/download/v{{version}}/yq_linux_amd64
  checksum_url: null
  extract: false
  binary: null
- name: jq
  version: 1.8.1
  url: https://github.com/jqlang/jq/releases/download/jq-{{version}}/jq-linux-amd64
  checksum_url: null
  extract: false
  binary: null

repositories:
- name: kubespray
  url: https://github.com/kubernetes-sigs/kubespray.git
  ref: master
  type: git
- name: opencenter-gitops-base
  url: https://github.com/rackerlabs/openCenter-gitops-base
  ref: main
  type: git

images:
  auto_discover:
  - source: repositories.kubespray
    patterns:
    - roles/*/defaults/main.yml
    - inventory/*/group_vars/*.yml

charts:
- name: cert-manager
  repo: https://charts.jetstack.io
  version: v1.16.2
  path: null
  ref: null
- name: ingress-nginx
  repo: https://kubernetes.github.io/ingress-nginx
  version: v1.9.0
  path: null
  ref: null
