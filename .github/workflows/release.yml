name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller==6.3.0

      - name: Build binary
        run: |
          pyinstaller opencenter-airgap.spec
          ls -lh dist/

      - name: Verify binary
        run: |
          ./dist/opencenter-airgap --version
          file dist/opencenter-airgap
          du -h dist/opencenter-airgap

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencenter-airgap-linux-amd64
          path: dist/opencenter-airgap
          retention-days: 7

  create-release:
    needs: build-binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: opencenter-airgap-linux-amd64
          path: dist/

      - name: Make binary executable
        run: chmod +x dist/opencenter-airgap

      - name: Generate checksums
        run: |
          cd dist
          sha256sum opencenter-airgap > opencenter-airgap.sha256
          cat opencenter-airgap.sha256

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/opencenter-airgap
            dist/opencenter-airgap.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
